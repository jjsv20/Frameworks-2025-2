<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Instructor | RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f8f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            background-color: #111;
            min-height: 100vh;
            color: #fff;
        }
        .sidebar .nav-link {
            color: #ccc;
            padding: 10px 20px;
        }
        .sidebar .nav-link.active,
        .sidebar .nav-link:hover {
            color: #fff;
            background-color: #333;
        }
        .main-content { padding: 30px; }
        .profile-card, .schedule-card, .stat-card {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        .profile-avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            background-color: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 15px;
        }
        .stat-number { font-size: 1.8rem; font-weight: bold; color: #000; }
        .stat-label { color: #555; font-size: 0.9rem; }
        .info-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .info-item:last-child { border-bottom: none; }
        .btn-simple { background-color: #000; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; text-decoration: none; display: inline-block; }
        .btn-simple:hover { background-color: #333; color: #fff; }
        .schedule-item { padding: 15px; border-left: 4px solid #000; margin-bottom: 10px; }
        .schedule-item:last-child { margin-bottom: 0; }
        @media (max-width: 768px) { .main-content { padding: 15px; } }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar p-0">
            <div class="position-sticky pt-4">
                <div class="text-center mb-4">
                    <h4 class="fw-bold"><i class="fas fa-skating"></i> RollerSpeed</h4>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="#"> <i class="fas fa-home"></i> Dashboard </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/instructores/clases}"> <i class="fas fa-calendar-alt"></i> Mis Clases </a>
                        
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/instructores/alumnos}"> <i class="fas fa-users"></i> Lista de Alumnos </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/instructores/editar}"> <i class="fas fa-user-edit"></i> Perfil </a>
                    </li>
                    <li class="nav-item mt-4">
                        <a class="nav-link" th:href="@{/auth/logout}"> <i class="fas fa-sign-out-alt"></i> Cerrar Sesión </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
            <!-- Welcome -->
            <div class="mb-4">
                <h2>¡Bienvenido, <span th:text="${instructor?.nombre ?: 'Instructor'}">Instructor</span>!</h2>
                <p>Gestiona tus clases y tus alumnos desde aquí.</p>
            </div>

            <div class="row g-4">
                <!-- Profile -->
                <div class="col-lg-4">
                    <div class="profile-card text-center">
                        <div class="profile-avatar"><i class="fas fa-user-tie"></i></div>
                        <h5 th:text="${instructor?.nombre ?: 'Nombre'}">Nombre del Instructor</h5>
                        <h6>Instructor</h6>
                        <div class="info-item">
                            <span>Email:</span>
                            <span th:text="${instructor?.user?.email ?: 'email@ejemplo.com'}">email@ejemplo.com</span>
                        </div>
                        <div class="info-item">
                            <span>Teléfono:</span>
                            <span th:text="${instructor?.telefono ?: '+57 300 123 4567'}">+57 300 123 4567</span>
                        </div>
                        <div class="info-item">
                            <span>Especialidad:</span>
                            <span th:text="${instructor?.especialidad ?: 'Patinaje'}">Patinaje</span>
                        </div>
                        <div class="text-center mt-3">
                            <a th:href="@{/instructores/editar}" class="btn-simple">Editar Perfil</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
