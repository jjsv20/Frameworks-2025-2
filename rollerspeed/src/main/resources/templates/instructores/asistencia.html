<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asistencia | RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body style="background-color:#f8f8f8;">
<div class="container mt-4">
    <h3 class="mb-4 text-center">📋 Control de Asistencia</h3>

    <!-- Mensaje si no hay asistencias -->
    <div th:if="${#lists.isEmpty(asistencias)}" class="alert alert-info text-center">
        No hay alumnos registrados para asistencia.
    </div>

    <!-- Tabla de asistencias -->
    <div th:if="${!#lists.isEmpty(asistencias)}" class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark text-center">
                <tr>
                    <th>Alumno</th>
                    <th>Clase</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="asistencia : ${asistencias}">
                    <td th:text="${asistencia.alumno.nombre}">Nombre Alumno</td>
                    <td th:text="${asistencia.clase.nombre}">Nombre Clase</td>
                    <td th:text="${asistencia.fecha}">2025-10-11</td>
                    <td class="text-center">
                        <span th:text="${asistencia.estado.name()}"
                              th:classappend="${asistencia.estado.name() == 'PRESENTE'} ? 'badge bg-success' :
                                              (${asistencia.estado.name() == 'AUSENTE'} ? 'badge bg-danger' :
                                              'badge bg-warning text-dark')">
                        </span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{'/instructores/asistencia/presente/' + ${asistencia.id}}"
                           class="btn btn-sm btn-success me-1" title="Marcar Presente">
                            <i class="fas fa-check"></i>
                        </a>
                        <a th:href="@{'/instructores/asistencia/ausente/' + ${asistencia.id}}"
                           class="btn btn-sm btn-danger" title="Marcar Ausente">
                            <i class="fas fa-times"></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Botón volver -->
    <div class="text-center mt-3">
        <a th:href="@{/instructores/clases}" class="btn btn-secondary">Volver a Mis Clases</a>
    </div>
</div>
</body>
</html>
