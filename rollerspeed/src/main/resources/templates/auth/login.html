<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RollerSpeed</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        body {
            background-color: #000000;
        }
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(174, 174, 174, 0.621);
        }
        .login-title {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .btn-primary {
            width: 100%;
        }
        .register-link {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
        .error-message {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbarlogin :: navbar}"></div>

    <div class="login-container">
        <h2 class="login-title">Iniciar Sesión</h2>

        <form th:action="@{/auth/login}" method="post">
    <div th:if="${param.error}" class="error-message">
        Credenciales incorrectas. Intenta de nuevo.
    </div>

    <div th:if="${param.logout}" class="text-success text-center mb-3">
        Sesión cerrada correctamente.
    </div>

    <div class="mb-3">
        <label for="username" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="username" name="username"
               placeholder="ejemplo@correo.com" required>
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="Ingrese su contraseña" required>
    </div>

    <button type="submit" class="btn btn-primary">Ingresar</button>
</form>

        <div class="text-center mt-3">
            <small>¿No tienes cuenta? <a th:href="@{/aspirantes/register}" target="_blank">Regístrate</a></small>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="fragments/footer :: footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
