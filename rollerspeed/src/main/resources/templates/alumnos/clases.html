<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Clases | RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:#f8f8f8;">
<div class="container mt-4">
    <h3 class="mb-4 text-center">🎓 Mis Clases Asignadas</h3>

    <div th:if="${#lists.isEmpty(clases)}" class="alert alert-info text-center">
        Aún no tienes clases asignadas.
    </div>

    <div th:if="${!#lists.isEmpty(clases)}" class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark text-center">
                <tr>
                    <th>Nombre</th>
                    <th>Día</th>
                    <th>Hora</th>
                    <th>Duración</th>
                    <th>Instructor</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="clase : ${clases}">
                    <td th:text="${clase.nombre}">Nombre</td>
                    <td th:text="${clase.dia}">Lunes</td>
                    <td th:text="${#temporals.format(clase.hora, 'HH:mm')}">08:00</td>
                    <td th:text="${clase.duracionMinutos + ' min'}">60 min</td>
                    <td th:text="${clase.instructor.nombre}">Instructor</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center mt-3">
        <a th:href="@{/alumnos/dashboard}" class="btn btn-secondary">Volver al Dashboard</a>
    </div>
</div>
</body>
</html>
