<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4">Editar Perfil</h2>

    <form th:action="@{/alumnos/editar}" th:object="${alumno}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" th:field="*{telefono}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Género</label>
            <select th:field="*{genero}" class="form-select">
                <option value="MASCULINO">Masculino</option>
                <option value="FEMENINO">Femenino</option>
                <option value="OTRO">Otro</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Método de Pago</label>
            <select th:field="*{metodoPago}" class="form-select">
                <option value="EFECTIVO">Efectivo</option>
                <option value="TRANSFERENCIA">Transferencia</option>
                <option value="TARJETA">Tarjeta</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Nivel</label>
            <select th:field="*{nivel}" class="form-select">
                <option value="INICIAL">Inicial</option>
                <option value="INTERMEDIO">Intermedio</option>
                <option value="AVANZADO">Avanzado</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        <a th:href="@{/alumnos/dashboard}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

</body>
</html>
