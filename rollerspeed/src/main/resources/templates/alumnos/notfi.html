<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Notificaciones | RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>📬 Bandeja de Entrada</h3>
    <div th:if="${#lists.isEmpty(notificaciones)}" class="alert alert-info mt-3">
        No tienes notificaciones por ahora.
    </div>
    <ul class="list-group mt-3" th:each="n : ${notificaciones}">
        <li class="list-group-item d-flex justify-content-between align-items-center"
            th:classappend="${!n.leida} ? 'list-group-item-warning' : ''">
            <span>
                <strong th:text="${n.mensaje}">Mensaje de notificación</strong><br>
                <small th:text="${#temporals.format(n.fecha, 'dd/MM/yyyy HH:mm')}"></small>
            </span>
            <span th:if="${!n.leida}" class="badge bg-primary">Nuevo</span>
        </li>
    </ul>
</div>
</body>
</html>
