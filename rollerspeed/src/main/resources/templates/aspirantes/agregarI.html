<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Agregar Instructor | RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card p-4 shadow-sm" style="width:100%;max-width:560px;">
        <h3 class="text-center text-primary mb-3">Agregar Instructor</h3>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/admin/instructores/guardar}" method="post">
            <div class="row">
                <div class="col-12 mb-2">
                    <input name="nombre" class="form-control" placeholder="Nombre completo" required>
                </div>
                <div class="col-12 mb-2">
                    <input name="correo" type="email" class="form-control" placeholder="Correo electrónico" required>
                </div>
                <div class="col-12 mb-2">
                    <input name="telefono" class="form-control" placeholder="Teléfono" required>
                </div>
                <div class="col-12 mb-2">
                    <input name="especialidad" class="form-control" placeholder="Especialidad" required>
                </div>
                <div class="col-12 mb-3">
                    <input name="password" type="password" class="form-control" placeholder="Contraseña" required>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary w-100" type="submit">Agregar Instructor</button>
                </div>
            </div>
        </form>

        <div class="text-center mt-3">
            <small>¿Deseas volver? <a th:href="@{/admin/dashboard}">Volver al Dashboard</a></small>
        </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
