<!-- src/main/resources/templates/admin/dashboard.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin | RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f8f8; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #111; min-height: 100vh; color: #fff; }
        .sidebar .nav-link { color: #ccc; padding: 10px 20px; }
        .sidebar .nav-link.active, .sidebar .nav-link:hover { color: #fff; background-color: #333; }
        .main-content { padding: 30px; }
        .stat-card { background: #fff; border-radius: 10px; padding: 20px; text-align: center; border: 1px solid #ddd; }
        .stat-number { font-size: 1.8rem; font-weight: bold; }
        .stat-label { color: #555; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar p-0">
            <div class="position-sticky pt-4">
                <div class="text-center mb-4">
                    <h4 class="fw-bold"><i class="fas fa-skating"></i> RollerSpeed</h4>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/admin/dashboard}"> <i class="fas fa-home"></i> Dashboard </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/gestionAlumnos}"> <i class="fas fa-users"></i> Alumnos </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/gestionInstructores}"> <i class="fas fa-chalkboard-teacher"></i> Instructores </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/reportes}"> <i class="fas fa-chart-line"></i> Reportes </a>
                    </li>
                    <li class="nav-item mt-4">
                        <a class="nav-link" th:href="@{/auth/logout}"> <i class="fas fa-sign-out-alt"></i> Cerrar Sesión </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
            <div class="mb-4">
                <h2>¡Bienvenido Administrador!</h2>
                <p>Desde aquí puedes gestionar alumnos, instructores y consultar reportes.</p>
            </div>

            <!-- Stats -->
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-number" th:text="${totalAlumnos ?: 0}">0</div>
                        <div class="stat-label">Alumnos Registrados</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-number" th:text="${totalInstructores ?: 0}">0</div>
                        <div class="stat-label">Instructores</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-number" th:text="${pagosPendientes ?: 0}">0</div>
                        <div class="stat-label">Pagos Pendientes</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
