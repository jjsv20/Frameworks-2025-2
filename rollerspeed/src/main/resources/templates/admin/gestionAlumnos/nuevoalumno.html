<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Alumno | RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 p-4">
            <h2 class="mb-4"><i class="fas fa-user-plus"></i> Registrar Nuevo Alumno</h2>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/admin/gestionAlumnos/nuevoalumno}" method="post" class="row g-3">
                <div class="col-md-6">
                    <input type="text" class="form-control" name="nombre" placeholder="Nombre" required />
                </div>
                <div class="col-md-6">
                    <input type="email" class="form-control" name="email" placeholder="Email" required />
                </div>
                <div class="col-md-6">
                    <input type="password" class="form-control" name="password" placeholder="Contraseña" required />
                </div>
                <div class="col-md-6">
                    <input type="date" class="form-control" name="fechaNacimiento" required />
                </div>
                <div class="col-md-6">
                    <select class="form-select" name="genero" required>
                        <option value="">Seleccione Género</option>
                        <option value="MASCULINO">Masculino</option>
                        <option value="FEMENINO">Femenino</option>
                        <option value="OTRO">Otro</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <input type="text" class="form-control" name="telefono" placeholder="Teléfono" />
                </div>
                <div class="col-md-6">
                    <select class="form-select" name="nivel" required>
                        <option value="">Seleccione Nivel</option>
                        <option th:each="n : ${niveles}" th:value="${n}" th:text="${n}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <select class="form-select" name="metodoPago" required>
                        <option value="">Método de Pago</option>
                        <option th:each="m : ${metodos}" th:value="${m}" th:text="${m}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Registrar
                    </button>
                    <a th:href="@{/admin/gestionAlumnos}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Volver
                    </a>
                </div>
            </form>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
