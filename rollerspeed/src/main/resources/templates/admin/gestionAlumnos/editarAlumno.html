<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Alumno | RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-label { font-weight: 600; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card p-4">
        <h2 class="text-center mb-4"><i class="fas fa-user-edit"></i> Editar Alumno</h2>

        <!-- Mensaje de error -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/admin/gestionAlumnos/editarAlumno}" method="post">
            <input type="hidden" name="id" th:value="${alumno.id}" />

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" th:value="${alumno.nombre}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" name="email" th:value="${alumno.email}" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="text" id="telefono" name="telefono" th:value="${alumno.telefono}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" th:value="${alumno.fechaNacimiento}" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="genero" class="form-label">Género</label>
                    <select id="genero" name="genero" class="form-select" required>
                        <option th:value="MASCULINO" th:selected="${alumno.genero == 'MASCULINO'}">Masculino</option>
                        <option th:value="FEMENINO" th:selected="${alumno.genero == 'FEMENINO'}">Femenino</option>
                        <option th:value="OTRO" th:selected="${alumno.genero == 'OTRO'}">Otro</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="nivel" class="form-label">Nivel</label>
                    <select id="nivel" name="nivel" class="form-select" required>
                        <option th:each="n : ${niveles}" 
                                th:value="${n}" 
                                th:text="${n}" 
                                th:selected="${alumno.nivel == n}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label for="metodoPago" class="form-label">Método de Pago</label>
                <select id="metodoPago" name="metodoPago" class="form-select" required>
                    <option th:each="m : ${metodos}" 
                            th:value="${m}" 
                            th:text="${m}" 
                            th:selected="${alumno.metodoPago == m}">
                    </option>
                </select>
            </div>

            <div class="d-flex justify-content-between">
                <a class="btn btn-secondary" th:href="@{/admin/gestionAlumnos}">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
