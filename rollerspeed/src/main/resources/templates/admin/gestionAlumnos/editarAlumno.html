<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Alumno | RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f8f8; }
        .form-card {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="form-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="fas fa-user-edit"></i> Editar Alumno</h2>
            <a class="btn btn-secondary" th:href="@{/admin/gestionAlumnos}">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
        </div>

        <!-- Formulario de edición -->
        <form th:action="@{/admin/gestionAlumnos/editarAlumno}" method="post">
            <input type="hidden" name="id" th:value="${alumno.id}" />

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" th:value="${alumno.nombre}" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Teléfono</label>
                    <input type="text" name="telefono" class="form-control" th:value="${alumno.telefono}" />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Género</label>
                    <select name="genero" class="form-select">
                        <option value="MASCULINO" th:selected="${alumno.genero == 'MASCULINO'}">Masculino</option>
                        <option value="FEMENINO" th:selected="${alumno.genero == 'FEMENINO'}">Femenino</option>
                        <option value="OTRO" th:selected="${alumno.genero == 'OTRO'}">Otro</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nivel</label>
                    <select name="nivel" class="form-select">
                        <option th:each="n : ${niveles}"
                                th:value="${n}" th:text="${n}"
                                th:selected="${n == alumno.nivel}">
                        </option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Método de Pago</label>
                    <select name="metodoPago" class="form-select">
                        <option th:each="m : ${metodos}"
                                th:value="${m}" th:text="${m}"
                                th:selected="${m == alumno.metodoPago}">
                        </option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Estado de Pago</label>
                    <select name="estadoPago" class="form-select">
                        <option th:each="ep : ${T(com.rollerspeed.rollerspeed.Model.AlumnoModel.EstadoPago).values()}"
                                th:value="${ep}" th:text="${ep}"
                                th:selected="${ep == alumno.estadoPago}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="mt-4 text-end">
                <button type="submit" class="btn btn-dark">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
