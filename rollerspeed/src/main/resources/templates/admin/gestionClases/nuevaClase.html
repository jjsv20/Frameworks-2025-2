<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Clase | RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h3 class="text-center mb-4">➕ Crear Nueva Clase</h3>

    <form th:action="@{/admin/gestionClases/guardar}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">Nombre de la clase</label>
            <input type="text" name="nombre" class="form-control" placeholder="Ejemplo: Avanzada de velocidad" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Día</label>
            <select name="dia" class="form-select" required>
                <option value="">Selecciona un día</option>
                <option>Lunes</option>
                <option>Martes</option>
                <option>Miércoles</option>
                <option>Jueves</option>
                <option>Viernes</option>
                <option>Sábado</option>
                <option>Domingo</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Hora</label>
            <input type="datetime-local" name="hora" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Duración (minutos)</label>
            <input type="number" name="duracionMinutos" class="form-control" placeholder="Ej: 60" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Instructor</label>
            <select name="instructorId" class="form-select" required>
                <option value="">Selecciona un instructor</option>
                <option th:each="inst : ${instructores}" 
                        th:value="${inst.id}" 
                        th:text="${inst.nombre}"></option>
            </select>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success">Guardar Clase</button>
            <a href="/admin/gestionClases" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
