<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clases | RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f8f8; }
        .sidebar {
            background-color: #111;
            min-height: 100vh;
            color: #fff;
        }
        .sidebar .nav-link { color: #ccc; padding: 10px 20px; }
        .sidebar .nav-link.active, .sidebar .nav-link:hover {
            color: #fff; background-color: #333;
        }
        .main-content { padding: 30px; }
        .badge-pendiente { background-color: #ffc107; color: #000; }
        .badge-pagado { background-color: #28a745; color: #fff; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar p-0">
            <div class="position-sticky pt-4">
                <div class="text-center mb-4">
                    <h4 class="fw-bold"><i class="fas fa-skating"></i> RollerSpeed</h4>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/gestionAlumnos}">
                            <i class="fas fa-users"></i> Alumnos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/gestionInstructores}">
                            <i class="fas fa-chalkboard-teacher"></i> Instructores
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/gestionPagos}"> 
                            <i class="fas fa-credit-card"></i> Pagos 
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/admin/gestionClases}"> 
                            <i class="fas fa-calendar"></i> Clases 
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/reportes}"> 
                            <i class="fas fa-chart-line"></i> Reportes 
                        </a>
                    </li>
                    <li class="nav-item mt-4">
                        <a class="nav-link" th:href="@{/auth/logout}">
                            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Gestión de Alumnos</h2>
                <a class="btn btn-dark" th:href="@{/admin/gestionClases/nuevaClase}">
                    <i class="fas fa-plus"></i> Nueva Clase
                </a>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark text-center">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Día</th>
                        <th>Hora</th>
                        <th>Duración</th>
                        <th>Instructor</th>
                        <th>Alumnos</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tr th:each="clase : ${clases}">
                    <td th:text="${clase.id}"></td>
                    <td th:text="${clase.nombre}"></td>
                    <td th:text="${clase.dia}"></td>
                    <td th:text="${#temporals.format(clase.hora, 'HH:mm')}"></td>
                    <td th:text="${clase.duracionMinutos + ' min'}"></td>
                    <td th:text="${clase.instructor != null ? clase.instructor.nombre : 'Sin asignar'}"></td>
                    <td>
                        <ul>
                            <li th:each="a : ${clase.alumnos}" th:text="${a.nombre}"></li>
                        </ul>
                    </td>
                    <td class="text-center">
                        <!-- Asignar Instructor -->
                        <div class="dropdown mb-2">
                            <button class="btn btn-sm btn-primary dropdown-toggle" data-bs-toggle="dropdown">
                                Asignar Instructor
                            </button>
                            <ul class="dropdown-menu">
                                <li th:each="i : ${instructores}">
                                    <a class="dropdown-item"
                                    th:href="@{/admin/gestionClases/asignarInstructor/{cId}/{iId}(cId=${clase.id}, iId=${i.id})}"
                                    th:text="${i.nombre}"></a>
                                </li>
                            </ul>
                        </div>

                        <!-- Agregar Alumno -->
                        <div class="dropdown">
                            <button class="btn btn-sm btn-success dropdown-toggle" data-bs-toggle="dropdown">
                                Agregar Alumno
                            </button>
                            <ul class="dropdown-menu">
                                <li th:each="al : ${alumnos}">
                                    <a class="dropdown-item"
                                    th:href="@{/admin/gestionClases/agregarAlumno/{cId}/{aId}(cId=${clase.id}, aId=${al.id})}"
                                    th:text="${al.nombre}"></a>
                                </li>
                            </ul>
                        </div>
                    </td>
                </tr>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
