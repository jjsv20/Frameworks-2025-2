<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Instructor | RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-label { font-weight: 600; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card p-4">
        <h2 class="text-center mb-4"><i class="fas fa-user-edit"></i> Editar Instructor</h2>

        <!-- Mensaje de error -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/admin/gestionInstructores/editarInstructor}" method="post">
            <input type="hidden" name="id" th:value="${instructor.id}" />

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" th:value="${instructor.nombre}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="correo" class="form-label">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" th:value="${instructor.correo}" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="text" id="telefono" name="telefono" th:value="${instructor.telefono}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label for="especialidad" class="form-label">Especialidad</label>
                    <select id="especialidad" name="especialidad" class="form-select" required>
                        <option th:each="e : ${especialidades}" 
                                th:value="${e}" 
                                th:text="${e}" 
                                th:selected="${instructor.especialidad == e}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a class="btn btn-secondary" th:href="@{/admin/gestionInstructores}">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
